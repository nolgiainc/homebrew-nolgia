name: Commit Attribution Check

# Fails a PR when any commit in it carries a Co-authored-by trailer crediting
# Claude or Anthropic. Org convention: commits carry no third-party attribution.
#
# NOL-171: the convention was enforced in hermes-agent alone, so every other
# repo quietly accumulated `Co-authored-by: Claude ... <noreply@anthropic.com>`
# trailers on its default branch — 59 of them in a single day. Nothing looked,
# so nothing stopped it. This is the durable half of the fix; without a check
# the convention decays again the moment someone forgets.
#
# Scope is deliberately narrow: only the `Co-authored-by:` TRAILER form is a
# violation. Ordinary prose mentioning Claude or Anthropic is legitimate and
# common here (the Anthropic adapter, Claude model classification), so the
# pattern is anchored to the start of a trailer line and never judges prose.
# A check that fires on real work gets switched off, which protects nothing.
#
# No paths filter on purpose: this gates commit messages, not files, so a
# docs-only PR must not be able to skip it.
#
# Prevention only. Existing history is deliberately left alone — stripping the
# trailers already merged would mean force-pushing six default branches and
# invalidating every clone for a cosmetic gain.

# workflow_dispatch exists so the tap bumper can run this check against its own
# bump commit (NOL-483). That commit has to land on main, main requires this
# check, and a PR opened with GITHUB_TOKEN never triggers `pull_request` — so
# without a dispatchable entry point the bot's only options are to bypass the
# gate or to stay broken. Dispatched here it runs the identical logic on the
# identical commit; the resulting check-run is what unblocks the push. Manual
# dispatch on any branch is fine too, and is a cheap way to test this check.
#
# Note on trust: because `--ref` selects which copy of this file executes, a
# dispatched branch runs that branch's version of the logic. That is not a hole
# this trigger opens — required status checks are matched by context *name*, so
# anyone with push access can already report a green check of this name from an
# `on: push` workflow on their own branch, with or without workflow_dispatch.
# The gate is only as strong as who may push to main; closing that properly is
# a repo-settings change (require a pull request before merging / restrict who
# can push to main), not something this file can enforce about itself.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: No third-party attribution trailers
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history: the check walks the PR's commit range

      - name: Reject Claude/Anthropic Co-authored-by trailers
        env:
          # On workflow_dispatch there is no pull_request payload, so fall back
          # to the default branch: the range to inspect is then everything the
          # dispatched ref adds on top of main, which is the same set of commits
          # a PR from that ref would carry.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -uo pipefail

          if git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            RANGE_START=$(git merge-base "origin/$BASE_REF" HEAD)
          else
            RANGE_START="$BASE_SHA"
          fi

          # Without this, an empty RANGE_START makes the range below read as
          # `..HEAD`, which git resolves to HEAD..HEAD — an empty commit list
          # that reports "nothing to check" and passes green having verified
          # nothing. A gate that cannot determine what to inspect must fail.
          if [ -z "$RANGE_START" ]; then
            echo "::error::Could not resolve a base commit (BASE_REF='$BASE_REF', BASE_SHA='$BASE_SHA'). Refusing to pass without inspecting anything."
            exit 1
          fi

          COMMITS=$(git log --no-merges --format=%H "$RANGE_START..HEAD")
          if [ -z "$COMMITS" ]; then
            echo "No non-merge commits in range — nothing to check."
            exit 0
          fi

          FAILED=0
          for sha in $COMMITS; do
            HITS=$(git log -1 --format=%B "$sha" | grep -Ei '^Co-authored-by:.*(claude|anthropic)' || true)
            if [ -n "$HITS" ]; then
              FAILED=1
              echo "::error::${sha} carries a disallowed attribution trailer"
              git log -1 --format='  %h %s' "$sha"
              echo "$HITS" | sed 's/^/    /'
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Org commits carry no third-party attribution."
            echo "Reword the offending commit(s) on this PR branch and update it:"
            echo "    git rebase -i $RANGE_START"
            echo "Never rewrite a default branch to fix this."
            exit 1
          fi

          echo "OK — no Claude/Anthropic Co-authored-by trailers in $(git log --no-merges --oneline "$RANGE_START..HEAD" | wc -l | tr -d ' ') commit(s)."
