name: Update Formula

# Bumps only the version and sha256 fields of Formula/nolgia.rb to match the
# latest nolgia-cli release. The formula itself is a normal committed file;
# edit it freely — this workflow never rewrites anything else.
#
# Triggers:
#   - repository_dispatch(cli-released): fired by nolgia-cli's release workflow
#     immediately after it publishes a GitHub Release, so the tap is current
#     within a minute instead of up to six hours later.
#   - schedule: token-free backstop. If the dispatch never fires (missing or
#     expired PAT on nolgia-cli), the tap still self-heals within six hours.
#     Mirrors the same belt-and-braces shape as nolgia-api's OpenAPI
#     propagation, where downstream repos also keep a scheduled fallback.
#   - workflow_dispatch: manual.
#
# HOW THE BUMP REACHES main, AND WHY IT IS NOT A PLAIN `git push` (NOL-483)
#
# This job used to commit and `git push` straight to main. On 2026-07-29 main
# gained a required status check, "No third-party attribution trailers"
# (NOL-171). That check is `pull_request`-triggered, so a commit pushed
# directly to main has never run it, and GitHub rejects the push:
#
#   remote: error: GH006: Protected branch update failed for refs/heads/main.
#   remote: - Required status check "No third-party attribution trailers" is expected.
#
# Every run from v0.2.13 onward died on that line, which is how the tap fell
# seven releases behind. The runs between the check landing and v0.2.13 passed
# only because the formula was already current and the push step never ran —
# the workflow was already broken and looked green.
#
# The fix cannot be a bypass. Repo-level rulesets refuse to accept the GitHub
# Actions app as a bypass actor ("Actor GitHub Actions integration must be part
# of the ruleset source or owner organization"), and this repo has no secrets at
# all — no PAT, no App key — so there is no second identity to push as. Opening
# a PR does not help either: a PR opened with GITHUB_TOKEN does not trigger
# `pull_request` workflows, so the required check would never run on it and the
# PR would sit unmergeable forever.
#
# So instead of dodging the gate, the bump goes through it. The commit is
# pushed to a scratch branch, the real attribution check is dispatched against
# that branch (`workflow_dispatch` is the one event GITHUB_TOKEN is allowed to
# raise), and only once that check is genuinely green on that exact SHA is main
# fast-forwarded onto it. The commit that lands on main has passed the same
# check a human PR would, on its own SHA. Nothing is bypassed or forged, and
# main keeps the flat history the previous direct-push design gave it.
#
# The safety the old comment claimed for direct-push still holds: the "Verify"
# block below refuses to commit a formula whose checksums do not match freshly
# downloaded release artifacts — a check no human reviewer could do by eye.

on:
  repository_dispatch:
    types: [cli-released]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write # push the scratch branch and fast-forward main
  actions: write # dispatch the attribution check onto the bump commit
  checks: read # read that check's verdict back off the commit
  issues: write # raise/resolve the alert issue

concurrency:
  group: update-formula
  # Never cancel mid-run: this job pushes to main, and interrupting it between
  # the formula rewrite and the verify step is not a state worth racing into.
  cancel-in-progress: false

env:
  # Scratch branch the bump commit is staged on so the required check can run
  # against it. Reused (force-pushed) every run; deleted on success.
  BUMP_BRANCH: bot/formula-bump
  # Must match the `name:` of the job in commit-attribution-check.yml, which is
  # also the context name main's protection requires.
  ATTRIBUTION_CHECK: No third-party attribution trailers

jobs:
  update:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # NOTE: credentials are intentionally persisted — the publish step below
        # pushes with this checkout token. The `persist-credentials: false`
        # dance is only required when a job hands the push off to
        # peter-evans/create-pull-request, which supplies its own token and then
        # collides with the persisted Authorization header.

      - name: Bump version and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          # Fired by nolgia-cli's release workflow; informational only. The tag
          # actually used is always re-resolved from the GitHub API below, so a
          # malformed or spoofed payload cannot steer which artifacts we hash.
          DISPATCH_TAG: ${{ github.event.client_payload.tag || '' }}
        run: |
          set -euo pipefail

          if [ -n "${DISPATCH_TAG}" ]; then
            echo "Dispatched for tag: ${DISPATCH_TAG} (re-resolving from API anyway)"
          fi

          # Always address the canonical org explicitly rather than relying on
          # GitHub's org-rename redirect: if an abandoned old org name is ever
          # re-registered by someone else, the redirect stops pointing at us and
          # this job would hash a stranger's binaries and push them to the tap.
          REPO="nolgiainc/nolgia-cli"

          TAG=$(gh release view --repo "${REPO}" --json tagName --jq .tagName)
          export VERSION="${TAG#v}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          echo "Latest release: ${TAG} (version ${VERSION})"

          # Download to files, then hash. Two things matter here:
          #   -f  makes curl fail on an HTTP error instead of writing the error
          #       body. Without it a renamed or missing asset yields a 9-byte
          #       "Not Found" page that hashes cleanly to
          #       0019dfc4...b49b5 and gets committed as a real checksum,
          #       breaking `brew install` for everyone with no failure signal.
          #   The size floor catches any other way a non-binary could sneak in.
          fetch() {
            local name="$1" dest="$2"
            echo "Fetching ${name}"
            curl -fsSL --retry 3 --retry-delay 5 -o "${dest}" "${BASE}/${name}"
            local size
            size=$(wc -c < "${dest}")
            if [ "${size}" -lt 1000000 ]; then
              echo "::error::${name} is only ${size} bytes — that is not a release binary. Refusing to hash it."
              file "${dest}" || true
              exit 1
            fi
            echo "  ${size} bytes — $(file -b "${dest}")"
          }

          fetch nolgia-x86_64-apple-darwin mac.bin
          fetch nolgia-x86_64-unknown-linux-gnu linux.bin

          # Assign then export separately: `export X=$(...)` returns export's
          # status, masking a failure in the substitution (shellcheck SC2155).
          MAC_SHA=$(sha256sum mac.bin | cut -d' ' -f1)
          LINUX_SHA=$(sha256sum linux.bin | cut -d' ' -f1)
          export MAC_SHA LINUX_SHA
          echo "macOS  sha256: ${MAC_SHA}"
          echo "Linux  sha256: ${LINUX_SHA}"

          python3 - <<'PY'
          import os
          import re

          path = "Formula/nolgia.rb"
          text = open(path).read()
          text, n = re.subn(
              r'^(  version )"[^"]*"',
              lambda m: f'{m.group(1)}"{os.environ["VERSION"]}"',
              text, count=1, flags=re.M,
          )
          assert n == 1, "did not find the version line in Formula/nolgia.rb"

          # The two sha256 lines are positional: macOS block first, Linux
          # second. Assert the count so a future formula edit that adds or
          # removes a platform fails loudly here instead of silently writing
          # the macOS checksum onto the wrong platform.
          assert len(re.findall(r'sha256 "[^"]*"', text)) == 2, (
              "expected exactly 2 sha256 lines (macOS then Linux); "
              "the formula layout changed — update this workflow to match"
          )
          shas = iter([os.environ["MAC_SHA"], os.environ["LINUX_SHA"]])
          text = re.sub(r'(sha256 )"[^"]*"', lambda m: f'{m.group(1)}"{next(shas)}"', text, count=2)
          open(path, "w").write(text)
          PY

          # Independent read-back: confirm what actually landed on disk matches
          # the bytes we downloaded. This is the mechanical stand-in for the
          # human review that a bump PR would have provided.
          echo "Verifying rewritten formula"
          grep -q "  version \"${VERSION}\"" Formula/nolgia.rb \
            || { echo "::error::version ${VERSION} missing from formula after rewrite"; exit 1; }
          grep -q "sha256 \"${MAC_SHA}\"" Formula/nolgia.rb \
            || { echo "::error::macOS sha256 missing from formula after rewrite"; exit 1; }
          grep -q "sha256 \"${LINUX_SHA}\"" Formula/nolgia.rb \
            || { echo "::error::Linux sha256 missing from formula after rewrite"; exit 1; }
          echo "Formula verified against freshly downloaded artifacts."

          # The downloaded binaries are 30 MB of untracked junk sitting next to
          # a file we are about to `git add`. Remove them so nothing can widen
          # the commit beyond the formula.
          rm -f mac.bin linux.bin

      - name: Publish bump to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- Formula/nolgia.rb; then
            echo "formula already current"
            exit 0
          fi

          VERSION=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/nolgia.rb)

          git config user.name "nolgia-bot"
          git config user.email "admin@nolgia.ai"
          git add Formula/nolgia.rb
          git commit -m "chore: bump nolgia formula to ${VERSION}"
          SHA=$(git rev-parse HEAD)
          echo "Bump commit: ${SHA}"

          # Stage the commit where the required check can run against it. Force
          # because a previous failed run may have left this branch behind; it
          # is bot-owned scratch, never a base for anything.
          git push --force origin "HEAD:refs/heads/${BUMP_BRANCH}"

          # workflow_dispatch is the one event GITHUB_TOKEN is permitted to
          # raise (repository_dispatch is the other); every other event it
          # triggers is suppressed to prevent recursive runs. That exception is
          # what makes this whole approach possible.
          echo "Dispatching '${ATTRIBUTION_CHECK}' against ${BUMP_BRANCH}"
          gh workflow run commit-attribution-check.yml --ref "${BUMP_BRANCH}"

          # Poll the commit's check-runs rather than the workflow run object:
          # branch protection is satisfied by a check-run on the SHA, so the
          # SHA is the thing to assert on. It is also immune to the run being
          # superseded or re-run.
          echo "Waiting for '${ATTRIBUTION_CHECK}' on ${SHA}"
          deadline=$(( SECONDS + 900 ))
          status=""
          conclusion=""
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            # `|| true` on both halves: a transient 5xx from the API must cost
            # one poll interval, not the whole bump. The deadline below is what
            # decides we have waited long enough.
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
                     --jq '.check_runs[] | [.name, .status, (.conclusion // "-")] | @tsv' \
                   2>/dev/null || true)
            line=$(printf '%s\n' "${runs}" \
                   | awk -F'\t' -v want="${ATTRIBUTION_CHECK}" '$1 == want { print; exit }' || true)
            if [ -z "${line}" ]; then
              echo "  not started yet"
            else
              status=$(printf '%s' "${line}" | cut -f2)
              conclusion=$(printf '%s' "${line}" | cut -f3)
              echo "  ${status} / ${conclusion}"
              [ "${status}" = "completed" ] && break
            fi
            sleep 15
          done

          if [ "${status}" != "completed" ]; then
            echo "::error::'${ATTRIBUTION_CHECK}' did not complete on ${SHA} within 15 minutes. Not touching main."
            exit 1
          fi
          if [ "${conclusion}" != "success" ]; then
            echo "::error::'${ATTRIBUTION_CHECK}' concluded '${conclusion}' on ${SHA}. Not touching main."
            exit 1
          fi
          echo "Check is green on ${SHA}."

          # Fast-forward main onto the exact SHA the check passed on. Anything
          # that rewrote the commit here (a squash, a rebase) would produce a
          # different SHA carrying no check, and the push would be rejected
          # again — the whole point is that these are the same commit.
          git push origin "${SHA}:refs/heads/main"
          echo "main is now at ${SHA} (formula ${VERSION})."

          git push origin --delete "${BUMP_BRANCH}" || \
            echo "::warning::Could not delete ${BUMP_BRANCH}; harmless, the next run force-pushes over it."

  # Separate job, and it checks out for itself, so that a failure in `update`'s
  # own checkout still alarms. A local action cannot run in a job whose
  # checkout never happened.
  alert:
    name: Alert on failure
    needs: [update]
    if: always() && needs.update.result != 'cancelled'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Raise or resolve the tap-automation alert
        uses: ./.github/actions/alert
        with:
          key: update-formula-failing
          state: ${{ needs.update.result == 'success' && 'resolved' || 'firing' }}
          title: 'Homebrew tap bumper is failing — `brew install nolgia` is going stale'
          body: >-
            The `Update Formula` workflow failed, so `Formula/nolgia.rb` is no
            longer being bumped to match the latest `nolgia-cli` release. Every
            `brew install nolgia` and `brew upgrade` now serves whatever version
            the formula was last left at. This is what NOL-483 was: seven
            releases of drift because nobody was told.
          token: ${{ github.token }}
